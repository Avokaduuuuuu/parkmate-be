server:
  port: ${PAYMENT_PORT}

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:5432/${PAYMENT_DATABASE:PAYMENT_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  endpoint: ${MOMO_PAYMENT_URL:https://test-payment.momo.vn/v2/gateway/api/create}
  ipn-url: ${MOMO_NOTIFY_URL:http://localhost:8080/api/v1/payment/momo/ipn}
  redirect-url: ${MOMO_RETURN_URL:http://localhost:8080/api/payment/momo/return}
  request-type: captureWallet
  lang: vi
  timeout: 30000

payos:
  client-id: ${PAYOS_CLIENT_ID:paste-client-id-here}
  api-key: ${PAYOS_API_KEY:paste-api-key-here}
  payout-api-key: ${PAYOS_PAYOUT_API_KEY:${PAYOS_API_KEY}}
  checksum-key: ${PAYOS_CHECKSUM_KEY:paste-checksum-key-here}
  return-url: ${PAYOS_RETURN_URL:http://localhost:8080/api/v1/payment-service/payos/return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8080/api/v1/payment-service/payos/cancel}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    URLs:
      - name: Payment Service via Gateway
        url: /v3/api-docs
  use-management-port: false
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: payment-service

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
  level:
    root: INFO
    com.parkmate: DEBUG