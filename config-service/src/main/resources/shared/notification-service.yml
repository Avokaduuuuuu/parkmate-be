server:
  port: ${NOTIFICATION_PORT}

spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

kafka:
  bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
  consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}

firebase:
  credential-path: classpath:firebase/parkmate-firebase-adminsdk.json
  project-id: parkmate-3636

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    URLs:
      - name: User Service via Gateway
        url: /v3/api-docs
  use-management-port: false
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: notification-service

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
  level:
    root: INFO
    com.parkmate: DEBUG