server:
  port: ${NOTIFICATION_PORT}

spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}



springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    URLs:
      - name: User Service via Gateway
        url: /v3/api-docs
  use-management-port: false
  show-actuator: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: parking-lot-service
    export:
      prometheus:
        enabled: true

  observations:
    key-values:
      application: parking-lot-service
    # ADD THESE - Enable HTTP observations
    http:
      server:
        requests:
          enabled: true
    annotations:
      enabled: true

  tracing:
    sampling:
      probability: 1.0
    enabled: true  # ADD THIS

  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

# ADD LOGGING PATTERN WITH TRACE IDs
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    com.parkmate: DEBUG
    io.micrometer.tracing: DEBUG  # Temporary - to see tracing activity